<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <main>
        <nav>
            <div class="logos-container">
            <a href="#" ><i class="ri-spotify-fill" id="spotify-image"></i></a>
            <div class="home-container">
                <a href="#" ><i class="ri-home-line" id="home-image"></i></a>
            </div>
            <a href="#"></a>
            </div>
            <div class="search-bar">
                <a href=""><i class="ri-search-line" id="search-image"></i></a>
                <input type="text" name="" id="search-text" placeholder="What do you want to play?">
            </div>
            <div class="non-search-bar">
                <div class="premiums">
                    <a href="#"class="premiums-text">Premium</a>
                    <a href="#"class="premiums-text">Support</a>
                    <a href="#"class="premiums-text">Download</a>
                </div>
            <img src="icons/Pi7_line.png" alt="" id="vertical-line">
            <div class="other-premiums">
                <div class="install-app-container">
                    <img src="" alt="">
                    <a href="#">Install app</a>
                </div>
                    <a href="#">Sign up</a>
                    <button id="login">Log in</button>
                </div>
            </div>
        </nav>
        <header>
            <aside id="left-stick">
                <p></p>
                <img src="" alt="" id="add-playlist">
                <div class="overflow-content">
                    <div class="creation">
                        <div class="create-playlist-container">
                            <p></p>
                            <p></p>
                            <button id="create-playlist-button"></button>
                        </div>
                    </div>
                        <div class="browse-podcasts">
                            <div class="create-podcast-container">
                                <p></p>
                                <p></p>
                                <button id="browse-podcastes-button"></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="some">
                    <a href="#">Legal</a>
                    <a href="#">Safety&Privacy Center</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Cookies</a>
                    <a href="#">About Ads</a>
                    <a href="#">Accessibility</a>
                </div>
                <a href="">Cookies</a>
                <img src="" alt="" id="internet">
                <button>English</button>
            </aside>
            <section id="right-overflow-content">
                <div class="trending-songs">
                    <p>Trending Songs</p>
                    <p></p>
                    <div class="song-cards">
                        <img src="" alt="">
                        <a href="#" class="song-name"></a>
                        <a href="#" class="songs-authors"></a>

                    </div>
                    <div class="song-cards">
                        <img src="" alt="">
                        <a href="#" class="song-name"></a>
                        <a href="#" class="songs-authors"></a>

                    </div>
                    <div class="song-cards">
                        <img src="" alt="">
                        <a href="#" class="song-name"></a>
                        <a href="#" class="songs-authors"></a>

                    </div>
                    <div class="song-cards">
                        <img src="" alt="">
                        <a href="#" class="song-name"></a>
                        <a href="#" class="songs-authors"></a>

                    </div>
                </div>
                <div class="popular-artists"></div>
                <div class="popular-albums"></div>
                <div class="popular-radio"></div>
                <div class="featured-charts"></div>
                <section>
                    <div class="company"></div>
                    <div class="communities"></div>
                    <div class="useful-link"></div>
                    <div class="spotify-plans"></div>
                    <img src="" alt="" id="instagram">
                    <img src="" alt="" id="twitter">
                    <img src="" alt="" id="facebook">
                </section>
                <footer>
                    <img src="" alt="" id="copyright">
                    <p>2026 Spotify 2026.</p>
                </footer>
            </section>
        </header>
        <footer>
            <section>
                <div class="premium-spotiffy">
                    <a href="#">Preview of Spotify</a>
                    <div id="spotify-premuim-content"></div>
                </div>
                <div id="Signup-free">
                    <button>Sign up-free</button>
                </div>
            </section>
        </footer>
    </main>
</body>
</html>
